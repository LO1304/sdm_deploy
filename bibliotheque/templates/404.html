{% extends 'bibliotheque/layout.html' %}

{% block title %}Page non trouvée (404) - SDM{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[60vh] text-center px-4">
    <div class="glass p-8 md:p-12 rounded-[32px] max-w-lg border border-white/10 relative overflow-hidden">
        <div class="absolute inset-0 bg-gold-500/5 z-0"></div>
        <div class="relative z-10">
            <div class="w-20 h-20 mx-auto rounded-full bg-gold-500/20 flex items-center justify-center mb-6 border border-gold-500/30">
                <i class="fa-solid fa-compass text-3xl text-gold-500 drop-shadow-[0_0_15px_rgba(212,175,55,0.5)]"></i>
            </div>
            
            <h1 class="text-3xl md:text-5xl font-black text-white tracking-tight mb-4 drop-shadow-md">404</h1>
            <h2 class="text-lg md:text-xl font-bold text-white/90 uppercase tracking-widest mb-4">Chemin Perdu</h2>
            
            <p class="text-sm md:text-base text-white/70 leading-relaxed mb-8">
                La page que vous recherchez semble ne pas exister ou a été déplacée.
            </p>
            
            <a href="{% url 'home' %}" class="inline-block w-full py-4 rounded-xl bg-gradient-to-r from-gold-400 to-gold-600 font-bold text-black shadow-lg hover:shadow-xl hover:-translate-y-1 transition-all">
                <i class="fa-solid fa-house mr-2"></i> Retour à l'accueil
            </a>
        </div>
    </div>
</div>
{% endblock %}
