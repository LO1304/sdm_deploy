<!DOCTYPE html>
<html lang="fr">
<head>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#03040a">
    <link rel="apple-touch-icon" href="/static/images/icons/icon-192x192.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Historique — SDM Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --gold:    #d4af37;  --gold-lt: #f5dc6e;  --gold-dk: #9a7520;
            --bg:      #03040a;
            --s1:      rgba(255,255,255,0.04);
            --s2:      rgba(255,255,255,0.07);
            --border:  rgba(255,255,255,0.07);
            --border-g:rgba(212,175,55,0.18);
            --text:    #f0f0f0;  --dim: rgba(255,255,255,0.38);
            --nav-h:   70px;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text);
            min-height: 100vh; padding-bottom: calc(var(--nav-h) + 30px);
            overflow-x: hidden; -webkit-font-smoothing: antialiased;
        }
        body::before {
            content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background: radial-gradient(ellipse at 0% 0%, rgba(212,175,55,0.05) 0%, transparent 45%),
                        radial-gradient(ellipse at 100% 100%, rgba(90,50,200,0.04) 0%, transparent 45%);
        }
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-thumb { background: rgba(212,175,55,0.2); border-radius: 9px; }

        /* TOPBAR */
        .topbar {
            position: sticky; top: 0; z-index: 50;
            display: flex; align-items: center; gap: 14px;
            height: 64px; padding: 0 16px;
            background: rgba(3,4,10,0.85);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border);
            max-width: 680px; margin: 0 auto;
        }
        .back-btn {
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: var(--s1); border: 1px solid var(--border);
            color: var(--dim); text-decoration: none;
            transition: all 0.3s cubic-bezier(0.16,1,0.3,1);
        }
        .back-btn:hover { background: rgba(212,175,55,0.1); color: var(--gold); border-color: var(--border-g); transform: translateX(-3px); }
        .topbar-title { flex: 1; font-size: 16px; font-weight: 600; }
        .topbar-title span {
            background: linear-gradient(130deg, var(--gold-lt), var(--gold));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }

        /* CONTENU */
        .content { position: relative; z-index: 1; max-width: 680px; margin: 0 auto; padding: 24px 16px; }

        /* ITEMS */
        .hist-item {
            display: flex; align-items: center; gap: 16px;
            padding: 18px 20px; border-radius: 20px;
            background: var(--s1); border: 1px solid var(--border);
            margin-bottom: 10px;
            opacity: 0; transform: translateY(16px);
            animation: fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) forwards;
            transition: all 0.35s cubic-bezier(0.16,1,0.3,1);
            position: relative; overflow: hidden;
        }
        .hist-item::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
            background: linear-gradient(to bottom, var(--gold-lt), var(--gold));
            border-radius: 0 2px 2px 0; opacity: 0; transition: opacity 0.3s;
        }
        .hist-item:hover { background: var(--s2); border-color: var(--border-g); transform: translateX(4px); }
        .hist-item:hover::before { opacity: 1; }

        .hist-icon {
            width: 46px; height: 46px; border-radius: 14px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; color: var(--gold);
            background: linear-gradient(135deg, rgba(212,175,55,0.12), rgba(212,175,55,0.02));
            border: 1px solid rgba(212,175,55,0.16);
        }
        .hist-body { flex: 1; min-width: 0; }
        .hist-name {
            font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.9);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            margin-bottom: 4px;
        }
        .hist-date { font-size: 10px; color: var(--dim); letter-spacing: 0.06em; }
        .hist-count-wrap { text-align: right; flex-shrink: 0; }
        .hist-count { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; color: var(--text); line-height: 1; }
        .hist-count-label { font-size: 8px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); margin-top: 3px; }

        /* ÉTAT VIDE */
        .empty-state {
            text-align: center; padding: 80px 20px; color: var(--dim);
            animation: fadeUp 0.8s both;
        }
        .empty-icon { font-size: 52px; margin-bottom: 20px; opacity: 0.25; animation: iconFloat 3s ease-in-out infinite; }
        @keyframes iconFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
        .empty-title { font-size: 15px; font-weight: 500; opacity: 0.5; margin-bottom: 8px; }
        .empty-sub { font-size: 12px; opacity: 0.3; }

        /* NAV */
        .nav-island {
            position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 32px); max-width: 420px; height: var(--nav-h); border-radius: 99px;
            background: rgba(8,10,20,0.9);
            backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 20px 60px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.06);
            display: flex; align-items: center; justify-content: space-around;
            padding: 0 12px; z-index: 100;
        }
        .nav-item {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 4px; text-decoration: none; color: rgba(255,255,255,0.3);
            transition: all 0.3s; position: relative; height: 100%;
        }
        .nav-item i { font-size: 20px; transition: transform 0.4s cubic-bezier(0.175,0.885,0.32,1.275); }
        .nav-item.active { color: var(--gold); }
        .nav-item.active i { transform: translateY(-8px); filter: drop-shadow(0 4px 8px rgba(212,175,55,0.4)); }
        .nav-dot { position: absolute; bottom: 12px; width: 4px; height: 4px; border-radius: 50%; background: var(--gold); opacity: 0; transform: scale(0); transition: all 0.3s; }
        .nav-item.active .nav-dot { opacity: 1; transform: scale(1); }

        @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
    </style>
</head>
<body>
    <!-- TOPBAR -->
    <div class="topbar">
        <a href="{% url 'home' %}" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <h1 class="topbar-title">Mon <span>Historique</span></h1>
    </div>

    <div class="content">
        {% if historique %}
            {% for item in historique %}
            <div class="hist-item" style="animation-delay: {{ forloop.counter0 }}0ms">
                <div class="hist-icon">
                    <i class="fa-solid fa-fingerprint"></i>
                </div>
                <div class="hist-body">
                    <div class="hist-name">{{ item.zikr.titre }}</div>
                    <div class="hist-date">{{ item.date_seance|date:"d M Y à H:i" }}</div>
                </div>
                <div class="hist-count-wrap">
                    <div class="hist-count">{{ item.nombre_total }}</div>
                    <div class="hist-count-label">Répétitions</div>
                </div>
            </div>
            {% endfor %}
        {% else %}
            <div class="empty-state">
                <div class="empty-icon"><i class="fa-solid fa-scroll"></i></div>
                <div class="empty-title">Aucun historique pour le moment</div>
                <div class="empty-sub">Vos séances de Zikr apparaîtront ici</div>
            </div>
        {% endif %}
    </div>

    <!-- NAV BAS -->
    <nav class="nav-island">
        <a href="{% url 'home' %}" class="nav-item"><i class="fa-solid fa-house-chimney"></i><div class="nav-dot"></div></a>
        <a href="{% url 'liste' 'khassida' %}" class="nav-item"><i class="fa-solid fa-book-open"></i><div class="nav-dot"></div></a>
        <a href="{% url 'dashboard' %}" class="nav-item active"><i class="fa-solid fa-chart-line"></i><div class="nav-dot"></div></a>
        <a href="{% url 'favoris' %}" class="nav-item"><i class="fa-solid fa-heart"></i><div class="nav-dot"></div></a>
        <a href="{% url 'profile' %}" class="nav-item"><i class="fa-solid fa-user"></i><div class="nav-dot"></div></a>
    </nav>

    <script>
        if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js')); }
    </script>
</body>
</html>
