{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=DM+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --dark: #05070a; }
        body { background: var(--dark); font-family: 'DM Mono', monospace; color: white; }
        .glass { background: rgba(255,255,255,0.02); border: 1px solid rgba(212,175,55,0.1); backdrop-filter: blur(10px); }
        .gold-text { font-family: 'Cormorant Garamond', serif; color: var(--gold); }
        input { background: rgba(255,255,255,0.05)!important; border: 1px solid rgba(212,175,55,0.1)!important; border-radius: 12px!important; padding: 10px 15px!important; color: white!important; width: 100%; }
        input:focus { border-color: var(--gold)!important; outline: none; }
        ul.errorlist { color: #f87171; font-size: 10px; margin-bottom: 10px; }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-4">

    <div class="glass w-full max-w-[400px] rounded-[2.5rem] p-10 shadow-2xl border-t-gold/20">
        <div class="text-center mb-8">
            <h1 class="text-4xl gold-text mb-2 uppercase tracking-widest">SDM</h1>
            <p class="text-[9px] uppercase tracking-[0.4em] opacity-40">Créer un compte</p>
        </div>

        <form method="post" class="space-y-4">
            {% csrf_token %}
            
            {% for field in form %}
            <div class="flex flex-col gap-1">
                <label class="text-[8px] uppercase tracking-widest opacity-30 ml-1">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <span class="text-[8px] text-red-400">{{ field.errors.0 }}</span>
                {% endif %}
            </div>
            {% endfor %}

            <button type="submit" class="w-full bg-[#d4af37] text-black py-4 rounded-xl text-[10px] font-extrabold uppercase tracking-[0.2em] hover:brightness-110 transition-all mt-6">
                Rejoindre la collection
            </button>
        </form>

        <div class="mt-8 text-center">
            <p class="text-[10px] opacity-40">
                Déjà inscrit ? 
                <a href="{% url 'login' %}" class="text-[#d4af37] hover:underline ml-1">Se connecter</a>
            </p>
        </div>
    </div>

</body>
</html>
