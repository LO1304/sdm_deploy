{% extends "bibliotheque/index.html" %}

{% block content %}
<div style="padding: 20px; text-align: center; color: white; background: #03040a; min-height: 100vh;">
    <h2 class="gold-grad" style="font-family: serif;">{{ zikr.nom }}</h2>
    <p style="color: #888; font-size: 14px;">{{ zikr.description }}</p>

    <div id="counter-circle" style="width: 200px; height: 200px; border: 5px solid #D4AF37; border-radius: 50%; margin: 40px auto; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.1s;">
        <span id="count-display" style="font-size: 48px; font-weight: bold;">0</span>
    </div>
    
    <button onclick="validerSeance()" style="background: var(--gold-grad); border: none; padding: 10px 25px; border-radius: 20px; font-weight: bold; cursor: pointer;">
        Enregistrer la séance
    </button>

    <div style="margin-top: 40px; text-align: left; background: rgba(255,255,255,0.05); padding: 20px; border-radius: 20px;">
        <h4 style="color: #D4AF37; margin-bottom: 15px; font-size: 14px;">Mes dernières séances</h4>
        {% for session in mes_sessions %}
            <div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(212,175,55,0.1);">
                <span style="color: #888; font-size: 12px;">{{ session.date_seance|date:"d M Y" }}</span>
                <span style="font-weight: bold;">{{ session.nombre_total }}</span>
            </div>
        {% empty %}
            <p style="font-size: 12px; color: #555; text-align: center;">Aucune donnée encore.</p>
        {% endfor %}
    </div>
</div>

<script>
    let count = 0;
    const display = document.getElementById('count-display');
    const circle = document.getElementById('counter-circle');

    circle.addEventListener('click', () => {
        count++;
        display.innerText = count;
        circle.style.transform = "scale(0.95)";
        setTimeout(() => circle.style.transform = "scale(1)", 100);
        // Ici tu peux ajouter un petit son de clic ou une vibration
    });

    function validerSeance() {
        if (count === 0) return;
        
        fetch("{% url 'enregistrer_seance' %}", {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ zikr_id: "{{ zikr.id }}", total: count })
        }).then(res => {
            if (res.ok) location.reload();
        });
    }
</script>
{% endblock %}
