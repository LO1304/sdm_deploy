{% extends 'bibliotheque/layout.html' %}

{% block title %}Créer un Zikr & Objectif Communautaire{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto pb-28">
    <div class="flex items-center gap-3 mb-5">
        <a href="{% url 'zikr_communaute_list' %}" class="w-10 h-10 rounded-xl glass flex items-center justify-center border border-white/15 text-white hover:border-gold-400" style="text-decoration:none;">
            <i class="fa-solid fa-arrow-left text-xs"></i>
        </a>
        <div>
            <span class="text-[10px] font-extrabold uppercase tracking-widest text-gold-400 block">Zikr en Communauté</span>
            <h1 class="text-lg md:text-2xl font-black text-white">Créer un Zikr & Objectif</h1>
        </div>
    </div>

    <div class="glass mihrab-card rounded-3xl p-5 md:p-6 border border-gold-500/35 shadow-2xl">
        <form method="POST" action="{% url 'zikr_communaute_create' %}" id="commZikrForm" class="space-y-4">
            {% csrf_token %}

            <div>
                <label for="titre" class="block text-xs font-extrabold text-gold-400 uppercase tracking-wider mb-1.5">
                    1. Titre de la Session *
                </label>
                <input type="text" id="titre" name="titre" required
                       placeholder="Ex: Grand Zikr du Vendredi, Hadiya Touba..."
                       class="w-full px-4 py-3 rounded-xl bg-black/50 border border-gold-500/35 text-white text-sm font-semibold focus:outline-none focus:border-gold-400">
            </div>

            <div>
                <label class="block text-xs font-extrabold text-gold-400 uppercase tracking-wider mb-1.5">
                    2. Formule du Zikr à réciter *
                </label>
                <div class="grid grid-cols-2 gap-2 mb-3">
                    <button type="button" id="tab-predef" onclick="switchZikrSource('predef')"
                            class="py-2.5 px-3 rounded-xl bg-gold-500 text-black font-extrabold text-xs border border-gold-400">
                        Choisir dans la liste
                    </button>
                    <button type="button" id="tab-perso" onclick="switchZikrSource('perso')"
                            class="py-2.5 px-3 rounded-xl bg-black/40 text-white/80 font-bold text-xs border border-white/15">
                        Créer un nouveau Zikr
                    </button>
                </div>

                <!-- Option A : Liste des Zikrs -->
                <div id="div_zikr_predefini">
                    <select id="zikr_id" name="zikr_id"
                            class="w-full px-4 py-3 rounded-xl bg-black/50 border border-gold-500/35 text-white text-sm font-semibold focus:outline-none focus:border-gold-400">
                        {% for z in zikrs %}
                            <option value="{{ z.id }}" class="bg-[#081711] text-white">{{ z.titre }} (Obj. {{ z.objectif_par_defaut }})</option>
                        {% empty %}
                            <option value="" class="bg-[#081711] text-white">Aucun Zikr — cliquez sur « Créer un nouveau Zikr »</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Option B : Saisir un nouveau Zikr directement -->
                <div id="div_zikr_perso" class="hidden">
                    <input type="text" id="zikr_personnalise" name="zikr_personnalise"
                           placeholder="Ex: Lâ ilâha illallâh, Salâtoul Fâtihi, Astaghfiroullâh..."
                           class="w-full px-4 py-3 rounded-xl bg-black/50 border border-gold-500/35 text-white text-sm font-semibold focus:outline-none focus:border-gold-400">
                    <p class="text-[11px] text-white/55 mt-1">Ce nouveau Zikr sera également enregistré dans la bibliothèque des Zikrs.</p>
                </div>
            </div>

            <div>
                <label for="objectif_global" class="block text-xs font-extrabold text-gold-400 uppercase tracking-wider mb-1.5">
                    3. Objectif à atteindre (Nombre total) *
                </label>
                <input type="number" id="objectif_global" name="objectif_global" required value="1000" min="1"
                       class="w-full px-4 py-3 rounded-xl bg-black/50 border border-gold-500/35 text-white text-lg font-black text-center focus:outline-none focus:border-gold-400">
                <div class="flex flex-wrap gap-1.5 mt-2">
                    <button type="button" onclick="document.getElementById('objectif_global').value='100'" class="px-2.5 py-1 rounded-lg bg-gold-500/15 border border-gold-500/35 text-gold-400 text-xs font-extrabold">100</button>
                    <button type="button" onclick="document.getElementById('objectif_global').value='313'" class="px-2.5 py-1 rounded-lg bg-gold-500/15 border border-gold-500/35 text-gold-400 text-xs font-extrabold">313</button>
                    <button type="button" onclick="document.getElementById('objectif_global').value='1000'" class="px-2.5 py-1 rounded-lg bg-gold-500/15 border border-gold-500/35 text-gold-400 text-xs font-extrabold">1 000</button>
                    <button type="button" onclick="document.getElementById('objectif_global').value='10000'" class="px-2.5 py-1 rounded-lg bg-gold-500/15 border border-gold-500/35 text-gold-400 text-xs font-extrabold">10 000</button>
                    <button type="button" onclick="document.getElementById('objectif_global').value='100000'" class="px-2.5 py-1 rounded-lg bg-gold-500/15 border border-gold-500/35 text-gold-400 text-xs font-extrabold">100 000</button>
                </div>
            </div>

            <label class="flex items-center gap-3 p-3.5 rounded-2xl bg-white/5 border border-white/10 cursor-pointer">
                <input type="checkbox" id="est_prive" name="est_prive" class="w-5 h-5 accent-amber-400">
                <div>
                    <strong class="text-xs font-extrabold text-gold-400 block">Session Privée (Sur invitation uniquement)</strong>
                    <span class="text-[11px] text-white/55">Laissez décoché pour que toute la communauté puisse participer.</span>
                </div>
            </label>

            <button type="submit"
                    class="w-full py-4 rounded-2xl bg-gradient-to-r from-gold-400 to-gold-600 text-black font-black text-sm uppercase tracking-wider shadow-lg flex items-center justify-center gap-2 active:scale-95 transition-transform">
                <i class="fa-solid fa-floppy-disk"></i>
                <span>Enregistrer le Zikr & Lancer l'Objectif</span>
            </button>
        </form>
    </div>
</div>

<script>
    function switchZikrSource(mode) {
        const predefDiv = document.getElementById('div_zikr_predefini');
        const persoDiv = document.getElementById('div_zikr_perso');
        const tabPredef = document.getElementById('tab-predef');
        const tabPerso = document.getElementById('tab-perso');
        const inpPerso = document.getElementById('zikr_personnalise');

        if (mode === 'perso') {
            predefDiv.classList.add('hidden');
            persoDiv.classList.remove('hidden');
            tabPerso.className = 'py-2.5 px-3 rounded-xl bg-gold-500 text-black font-extrabold text-xs border border-gold-400';
            tabPredef.className = 'py-2.5 px-3 rounded-xl bg-black/40 text-white/80 font-bold text-xs border border-white/15';
            inpPerso.focus();
        } else {
            persoDiv.classList.add('hidden');
            predefDiv.classList.remove('hidden');
            inpPerso.value = '';
            tabPredef.className = 'py-2.5 px-3 rounded-xl bg-gold-500 text-black font-extrabold text-xs border border-gold-400';
            tabPerso.className = 'py-2.5 px-3 rounded-xl bg-black/40 text-white/80 font-bold text-xs border border-white/15';
        }
    }
</script>
{% endblock %}
