{% extends 'bibliotheque/layout.html' %}
{% load static %}

{% block title %}Résultat - Quizz Islamique{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto py-16 px-4 md:px-0 text-center">
    <div class="bg-white dark:bg-gray-800 rounded-3xl shadow-xl overflow-hidden p-10 border border-emerald-500/30">
        
        <div class="w-32 h-32 mx-auto bg-emerald-100 dark:bg-emerald-900/50 rounded-full flex items-center justify-center mb-6">
            <i class="fa-solid fa-star text-6xl text-yellow-400"></i>
        </div>
        
        <h2 class="text-3xl font-black text-gray-800 dark:text-gray-100 mb-2">Partie Terminée !</h2>
        <p class="text-gray-500 dark:text-gray-400 mb-8">Vous avez complété ce niveau.</p>
        
        <div class="bg-emerald-50 dark:bg-gray-700/50 rounded-2xl p-6 mb-8 border border-emerald-200 dark:border-emerald-800/50">
            <p class="text-sm font-bold text-emerald-700 dark:text-emerald-400 uppercase tracking-widest mb-1">Votre Score</p>
            <p class="text-6xl font-black text-emerald-600 dark:text-emerald-400">{{ score }} <span class="text-3xl text-emerald-500/50">/ {{ total }}</span></p>
        </div>
        
        <div class="flex flex-col sm:flex-row justify-center gap-4">
            <a href="{% url 'quiz_home' %}" class="bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-800 dark:text-gray-200 font-bold py-3 px-8 rounded-full transition-all">
                Retour aux Niveaux
            </a>
            <a href="{% url 'defi_create' %}" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-8 rounded-full shadow-lg hover:shadow-emerald-500/30 transition-all">
                Défier un ami <i class="fa-solid fa-user-group ml-2"></i>
            </a>
        </div>
    </div>
</div>
{% endblock %}
