{% extends 'bibliotheque/layout.html' %}
{% load static %}

{% block title %}Jouer - Defi {{ defi.code_partage }}{% endblock %}

{% block content %}
<style>
    .choice-btn { transition: all 0.3s cubic-bezier(0.16,1,0.3,1); }
    .choice-btn:hover:not(:disabled) { transform: translateY(-2px); border-color: rgba(16,185,129,0.5) !important; background: rgba(16,185,129,0.08) !important; }
    .choice-btn:active:not(:disabled) { transform: scale(0.97); }
    .choice-btn.correct { background: rgba(16,185,129,0.2) !important; border-color: rgba(16,185,129,0.6) !important; color: #34d399 !important; }
    .choice-btn.wrong { background: rgba(239,68,68,0.15) !important; border-color: rgba(239,68,68,0.5) !important; color: #f87171 !important; }
    .choice-btn:disabled { cursor: not-allowed; opacity: 0.7; }
    @keyframes slideIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    .slide-in { animation: slideIn 0.4s cubic-bezier(0.16,1,0.3,1) forwards; }
    .timer-ring { transition: stroke-dashoffset 1s linear; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
    .shake { animation: shake 0.3s ease; }
</style>

<div class="max-w-3xl mx-auto pb-8" id="quiz-app">

    <div class="glass rounded-[28px] overflow-hidden border border-white/5 shadow-2xl">
        
        <!-- Header -->
        <div class="bg-gradient-to-r from-yellow-600/80 to-amber-700/80 p-5 md:p-6 flex justify-between items-center relative overflow-hidden">
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-white/5 rounded-full blur-xl"></div>
            <div class="relative z-10">
                <p class="text-yellow-200/80 text-[10px] font-bold uppercase tracking-widest mb-1">Defi {{ defi.code_partage }}</p>
                <h2 class="text-xl md:text-2xl font-black text-white">{{ defi.niveau_choisi.nom }}</h2>
            </div>
            <div class="relative z-10 flex flex-col items-center">
                <svg width="56" height="56" class="transform -rotate-90">
                    <circle cx="28" cy="28" r="24" stroke="rgba(255,255,255,0.1)" stroke-width="4" fill="none"/>
                    <circle id="timer-ring" cx="28" cy="28" r="24" stroke="#fbbf24" stroke-width="4" fill="none" 
                            stroke-dasharray="150.8" stroke-dashoffset="0" stroke-linecap="round" class="timer-ring"/>
                </svg>
                <span id="timer" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-xl font-black text-white">15</span>
            </div>
        </div>
        
        <div class="h-1 bg-white/5 w-full">
            <div id="progress-bar" class="h-full bg-gradient-to-r from-yellow-500 to-amber-400 transition-all duration-500" style="width: 0%"></div>
        </div>

        <div class="p-6 md:p-10" id="question-area">
            <p class="text-[10px] font-bold uppercase tracking-widest text-white/30 mb-6 text-center">
                Question <span id="current-q">1</span> / <span id="total-q">10</span>
            </p>
            <p class="text-xl md:text-2xl font-bold text-white/90 mb-8 text-center leading-relaxed" id="question-text">Chargement...</p>
            <div class="grid grid-cols-1 gap-3" id="choices-container"></div>
        </div>

        <div class="p-5 bg-white/[0.02] border-t border-white/5 hidden text-center" id="action-area">
            <p id="feedback-msg" class="text-lg font-bold mb-4"></p>
            <button id="next-btn" class="bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-3.5 px-10 rounded-2xl shadow-lg transition-all active:scale-95 hidden text-sm">
                Question Suivante <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
            <button id="finish-btn" class="bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-bold py-3.5 px-10 rounded-2xl shadow-lg transition-all active:scale-95 hidden text-sm">
                Terminer <i class="fa-solid fa-flag-checkered ml-2"></i>
            </button>
        </div>
    </div>
</div>

<script>
    const questions = JSON.parse('{{ questions_json|escapejs }}');
    const csrfToken = '{{ csrf_token }}';
    const defiCode = '{{ defi.code_partage }}';
    const TOTAL_TIME = 15;
    
    let currentIdx = 0, score = 0, timerInterval, timeLeft = TOTAL_TIME;
    const circumference = 2 * Math.PI * 24;
    
    const ui = {
        question: document.getElementById('question-text'),
        choices: document.getElementById('choices-container'),
        currentQ: document.getElementById('current-q'),
        totalQ: document.getElementById('total-q'),
        timer: document.getElementById('timer'),
        timerRing: document.getElementById('timer-ring'),
        progress: document.getElementById('progress-bar'),
        actionArea: document.getElementById('action-area'),
        feedback: document.getElementById('feedback-msg'),
        nextBtn: document.getElementById('next-btn'),
        finishBtn: document.getElementById('finish-btn'),
    };
    
    ui.totalQ.innerText = questions.length;
    
    function loadQuestion() {
        if (currentIdx >= questions.length) { endGame(); return; }
        ui.actionArea.classList.add('hidden');
        ui.nextBtn.classList.add('hidden');
        ui.finishBtn.classList.add('hidden');
        const q = questions[currentIdx];
        ui.question.innerText = q.texte;
        ui.currentQ.innerText = currentIdx + 1;
        ui.progress.style.width = ((currentIdx / questions.length) * 100) + '%';
        ui.choices.innerHTML = '';
        q.choix.forEach((c, idx) => {
            const btn = document.createElement('button');
            btn.className = "choice-btn w-full py-4 px-5 text-left rounded-2xl border border-white/10 bg-white/[0.03] font-semibold text-white/80 text-sm slide-in";
            btn.style.animationDelay = (idx * 80) + 'ms';
            btn.innerHTML = `<span class="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-white/10 text-[11px] font-bold mr-3 text-white/50">${String.fromCharCode(65+idx)}</span>${c.texte}`;
            btn.onclick = () => handleAnswer(c.est_correct, q.points, btn);
            ui.choices.appendChild(btn);
        });
        startTimer();
    }
    
    function startTimer() {
        timeLeft = TOTAL_TIME;
        ui.timer.innerText = timeLeft;
        ui.timer.style.color = '#fff';
        ui.timerRing.style.stroke = '#fbbf24';
        ui.timerRing.style.strokeDashoffset = '0';
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            ui.timer.innerText = timeLeft;
            ui.timerRing.style.strokeDashoffset = circumference * (1 - timeLeft / TOTAL_TIME);
            if (timeLeft <= 5) { ui.timer.style.color = '#f87171'; ui.timerRing.style.stroke = '#ef4444'; }
            if (timeLeft <= 0) { clearInterval(timerInterval); handleTimeOut(); }
        }, 1000);
    }
    
    function handleAnswer(isCorrect, points, selectedBtn) {
        clearInterval(timerInterval);
        disableAll();
        if (isCorrect) {
            score += points;
            selectedBtn.classList.add('correct');
            ui.feedback.innerText = `Bonne reponse ! +${points} pts`;
            ui.feedback.className = "text-lg font-bold mb-4 text-emerald-400";
        } else {
            selectedBtn.classList.add('wrong', 'shake');
            ui.feedback.innerText = "Mauvaise reponse !";
            ui.feedback.className = "text-lg font-bold mb-4 text-red-400";
            highlightCorrect();
        }
        showNext();
    }
    
    function handleTimeOut() { disableAll(); ui.feedback.innerText = "Temps ecoule !"; ui.feedback.className = "text-lg font-bold mb-4 text-yellow-400"; highlightCorrect(); showNext(); }
    function highlightCorrect() { const q = questions[currentIdx]; q.choix.forEach((c, i) => { if (c.est_correct) { ui.choices.children[i].classList.add('correct'); ui.choices.children[i].innerHTML += ' <i class="fa-solid fa-check text-emerald-400 float-right mt-1"></i>'; } }); }
    function disableAll() { for (let b of ui.choices.children) b.disabled = true; }
    function showNext() { ui.actionArea.classList.remove('hidden'); if (currentIdx < questions.length - 1) ui.nextBtn.classList.remove('hidden'); else ui.finishBtn.classList.remove('hidden'); }
    
    ui.nextBtn.onclick = () => { currentIdx++; loadQuestion(); };
    ui.finishBtn.onclick = () => { endGame(); };
    
    function endGame() {
        ui.progress.style.width = '100%';
        ui.question.innerText = "Sauvegarde...";
        ui.choices.innerHTML = '<div class="flex justify-center py-8"><div class="w-10 h-10 border-4 border-yellow-500/30 border-t-yellow-500 rounded-full animate-spin"></div></div>';
        ui.actionArea.classList.add('hidden');
        ui.timer.innerText = "-";
        fetch("{% url 'api_defi_save_score' %}", {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
            body: JSON.stringify({ score: score, code: defiCode })
        })
        .then(r => r.json())
        .then(() => { window.location.href = "{% url 'defi_detail' defi.code_partage %}"; })
        .catch(() => { window.location.href = "{% url 'defi_detail' defi.code_partage %}"; });
    }
    
    loadQuestion();
</script>
{% endblock %}
