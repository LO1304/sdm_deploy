{% extends 'bibliotheque/layout.html' %}
{% load static %}

{% block title %}Jouer - Défi {{ defi.code_partage }}{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto py-10 px-4 md:px-0" id="quiz-container">
    <div class="bg-white dark:bg-gray-800 rounded-3xl shadow-xl overflow-hidden border border-blue-500/20">
        
        <!-- Header / Progress -->
        <div class="bg-gradient-to-r from-blue-700 to-indigo-800 p-6 text-white flex justify-between items-center">
            <div>
                <p class="text-blue-200 text-sm font-bold uppercase tracking-wider mb-1">Défi Multijoueur</p>
                <h2 class="text-2xl font-black">Code: {{ defi.code_partage }}</h2>
            </div>
            <div class="text-right">
                <div class="text-3xl font-black" id="timer">15</div>
                <p class="text-blue-200 text-xs">secondes</p>
            </div>
        </div>
        
        <!-- Progress Bar -->
        <div class="h-2 bg-gray-200 dark:bg-gray-700 w-full">
            <div id="progress-bar" class="h-full bg-yellow-400 transition-all duration-300" style="width: 0%"></div>
        </div>

        <!-- Question Area -->
        <div class="p-8 md:p-12 text-center" id="question-area">
            <h3 class="text-sm font-bold text-gray-400 mb-6 uppercase tracking-widest">Question <span id="current-q">1</span> / <span id="total-q">10</span></h3>
            <p class="text-2xl md:text-3xl font-bold text-gray-800 dark:text-gray-100 mb-10" id="question-text">
                Chargement...
            </p>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="choices-container">
                <!-- Buttons injected by JS -->
            </div>
        </div>

        <!-- Result / Next btn -->
        <div class="p-6 bg-gray-50 dark:bg-gray-900 border-t border-gray-100 dark:border-gray-800 hidden text-center" id="action-area">
            <p id="feedback-msg" class="text-lg font-bold mb-4"></p>
            <button id="next-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-all hidden">Question Suivante <i class="fa-solid fa-arrow-right ml-2"></i></button>
            <button id="finish-btn" class="bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-all hidden">Terminer le défi <i class="fa-solid fa-flag-checkered ml-2"></i></button>
        </div>

    </div>
</div>

<script>
    const questions = JSON.parse('{{ questions_json|escapejs }}');
    const csrfToken = '{{ csrf_token }}';
    const defiCode = '{{ defi.code_partage }}';
    
    let currentIdx = 0;
    let score = 0;
    let timerInterval;
    let timeLeft = 15; // 15s per question
    
    const uiQuestion = document.getElementById('question-text');
    const uiChoices = document.getElementById('choices-container');
    const uiCurrentQ = document.getElementById('current-q');
    const uiTotalQ = document.getElementById('total-q');
    const uiTimer = document.getElementById('timer');
    const uiProgress = document.getElementById('progress-bar');
    const uiActionArea = document.getElementById('action-area');
    const uiFeedback = document.getElementById('feedback-msg');
    const uiNextBtn = document.getElementById('next-btn');
    const uiFinishBtn = document.getElementById('finish-btn');
    
    uiTotalQ.innerText = questions.length;
    
    function loadQuestion() {
        if (currentIdx >= questions.length) {
            endGame();
            return;
        }
        
        uiActionArea.classList.add('hidden');
        uiNextBtn.classList.add('hidden');
        uiFinishBtn.classList.add('hidden');
        
        const q = questions[currentIdx];
        uiQuestion.innerText = q.texte;
        uiCurrentQ.innerText = currentIdx + 1;
        uiProgress.style.width = ((currentIdx / questions.length) * 100) + '%';
        
        uiChoices.innerHTML = '';
        q.choix.forEach(c => {
            const btn = document.createElement('button');
            btn.className = "py-4 px-6 text-left rounded-xl border-2 border-gray-200 dark:border-gray-700 hover:border-blue-500 dark:hover:border-blue-500 hover:bg-blue-50 dark:hover:bg-blue-900/30 transition-all font-semibold text-gray-700 dark:text-gray-200";
            btn.innerText = c.texte;
            btn.onclick = () => handleAnswer(c.est_correct, q.points, btn);
            uiChoices.appendChild(btn);
        });
        
        startTimer();
    }
    
    function startTimer() {
        timeLeft = 15;
        uiTimer.innerText = timeLeft;
        uiTimer.classList.remove('text-red-500');
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            uiTimer.innerText = timeLeft;
            if (timeLeft <= 5) uiTimer.classList.add('text-red-500');
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                handleTimeOut();
            }
        }, 1000);
    }
    
    function handleAnswer(isCorrect, points, selectedBtn) {
        clearInterval(timerInterval);
        disableAllButtons();
        
        if (isCorrect) {
            score += points;
            selectedBtn.classList.add('bg-blue-500', 'text-white', 'border-blue-600');
            selectedBtn.classList.remove('text-gray-700', 'dark:text-gray-200');
            uiFeedback.innerText = "Bonne réponse ! +" + points + " pts";
            uiFeedback.className = "text-lg font-bold mb-4 text-blue-600";
        } else {
            selectedBtn.classList.add('bg-red-500', 'text-white', 'border-red-600');
            selectedBtn.classList.remove('text-gray-700', 'dark:text-gray-200');
            uiFeedback.innerText = "Mauvaise réponse !";
            uiFeedback.className = "text-lg font-bold mb-4 text-red-600";
            highlightCorrectAnswer();
        }
        
        showNextAction();
    }
    
    function handleTimeOut() {
        disableAllButtons();
        uiFeedback.innerText = "Temps écoulé !";
        uiFeedback.className = "text-lg font-bold mb-4 text-yellow-600";
        highlightCorrectAnswer();
        showNextAction();
    }
    
    function highlightCorrectAnswer() {
        const q = questions[currentIdx];
        const buttons = uiChoices.children;
        q.choix.forEach((c, idx) => {
            if (c.est_correct) {
                buttons[idx].classList.add('border-emerald-500', 'border-2');
                buttons[idx].innerHTML += ' <i class="fa-solid fa-check text-emerald-500 float-right mt-1"></i>';
            }
        });
    }
    
    function disableAllButtons() {
        const buttons = uiChoices.children;
        for (let i = 0; i < buttons.length; i++) {
            buttons[i].disabled = true;
            buttons[i].classList.add('opacity-70', 'cursor-not-allowed');
        }
    }
    
    function showNextAction() {
        uiActionArea.classList.remove('hidden');
        if (currentIdx < questions.length - 1) {
            uiNextBtn.classList.remove('hidden');
        } else {
            uiFinishBtn.classList.remove('hidden');
        }
    }
    
    uiNextBtn.onclick = () => {
        currentIdx++;
        loadQuestion();
    };
    
    uiFinishBtn.onclick = () => {
        endGame();
    };
    
    function endGame() {
        uiProgress.style.width = '100%';
        uiQuestion.innerText = "Sauvegarde en cours...";
        uiChoices.innerHTML = '';
        uiActionArea.classList.add('hidden');
        uiTimer.innerText = "-";
        
        // Save score via API
        fetch("{% url 'api_defi_save_score' %}", {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrfToken
            },
            body: JSON.stringify({ score: score, code: defiCode })
        })
        .then(res => res.json())
        .then(data => {
            window.location.href = `/quiz/defi/${defiCode}/`;
        })
        .catch(err => {
            console.error(err);
            alert("Erreur lors de la sauvegarde.");
            window.location.href = `/quiz/defi/${defiCode}/`;
        });
    }
    
    // Init
    loadQuestion();
</script>
{% endblock %}
