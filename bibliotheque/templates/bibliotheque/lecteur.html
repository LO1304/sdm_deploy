<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lecteur - {{ document.titre }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        body { background-color: #050505; color: #fff; margin: 0; overflow: hidden; display:flex; flex-direction:column; height: 100vh; }
        .gold-text { color: #d4af37; }
        .gold-border { border-color: rgba(212,175,55,0.3); }
        .gold-bg { background-color: #d4af37; color: #000; }
        .nav-header { background: rgba(0,0,0,0.9); flex-shrink: 0; }
        
        #pdf-viewer-container {
            flex-grow: 1;
            overflow: auto;
            display: flex;
            justify-content: center;
            background-color: #111;
        }

        canvas {
            max-width: 100%;
            height: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            margin: 10px 0;
            border-radius: 4px;
        }

        .controls {
            background: rgba(10,10,10,0.95);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(212,175,55,0.3);
            flex-shrink: 0;
            z-index: 10;
        }

        .btn-control {
            background: #222;
            color: #d4af37;
            border: 1px solid rgba(212,175,55,0.5);
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            transition: all 0.2s;
        }
        .btn-control:active { background: #d4af37; color: #000; }
        .btn-control:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Modal Overlay */
        #resume-modal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center;
            z-index: 100;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="nav-header h-[60px] flex items-center px-4 justify-between border-b gold-border">
        <a href="javascript:history.back()" class="gold-text p-2">
            <i class="fa-solid fa-arrow-left text-xl"></i>
        </a>
        <h1 class="text-xs font-bold uppercase tracking-widest gold-text truncate px-4 text-center">
            {{ document.titre }}
        </h1>
        <div class="w-10"></div> 
    </div>

    <!-- Mode Audio si pas de PDF -->
    {% if not document.fichier_pdf and document.fichier_audio %}
        <iframe src="{{ document.fichier_audio.url }}#toolbar=0" class="w-full h-full border-none flex-grow"></iframe>
    {% elif document.fichier_pdf %}

        <div id="pdf-viewer-container">
            <canvas id="pdf-canvas"></canvas>
        </div>

        <div class="controls">
            <button id="prev-page" class="btn-control"><i class="fa-solid fa-chevron-left text-lg"></i></button>
            <div class="text-sm tracking-widest bg-[#1a1a1a] px-4 py-2 rounded-lg border border-[#333]">
                <span class="gold-text font-bold" id="page-num">-</span> <span class="text-gray-500 mx-1">/</span> <span id="page-count" class="text-gray-400">-</span>
            </div>
            <button id="next-page" class="btn-control"><i class="fa-solid fa-chevron-right text-lg"></i></button>
        </div>

        <!-- Modale de reprise -->
        <div id="resume-modal" class="hidden">
            <div class="bg-[#111] border border-[#d4af37] p-6 rounded-xl max-w-xs text-center shadow-2xl mx-4">
                <i class="fa-solid fa-bookmark text-4xl gold-text mb-4"></i>
                <h2 class="text-lg font-bold mb-2">Reprendre la lecture ?</h2>
                <p class="text-sm text-gray-400 mb-6">Vous étiez arrivé(e) à la page <span id="resume-page-num" class="gold-text font-bold">...</span> lors de votre dernière visite.</p>
                <div class="flex flex-col gap-3">
                    <button id="btn-resume" class="gold-bg text-black font-bold py-3 rounded-lg shadow-lg">Reprendre à cette page</button>
                    <button id="btn-restart" class="border border-gray-600 text-gray-300 py-3 rounded-lg hover:bg-gray-800">Recommencer au début</button>
                </div>
            </div>
        </div>

        <script>
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

            const url = "{{ document.fichier_pdf.url }}";
            let pdfDoc = null;
            let pageNum = 1;
            let pageIsRendering = false;
            let pageNumIsPending = null;
            const targetPageReprise = parseInt("{{ page_reprise|default:1 }}"); 

            // Elements
            const canvas = document.getElementById('pdf-canvas');
            const ctx = canvas.getContext('2d');
            const resumeModal = document.getElementById('resume-modal');

            // Render Page
            const renderPage = num => {
                pageIsRendering = true;
                pdfDoc.getPage(num).then(page => {
                    // Calcul d'une échelle responsive : 
                    // Echelle de base 1.5 pour bonne définition, le CSS le réduit à max 100%.
                    const viewport = page.getViewport({ scale: 2.0 });
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    const renderCtx = { canvasContext: ctx, viewport: viewport };

                    page.render(renderCtx).promise.then(() => {
                        pageIsRendering = false;
                        if (pageNumIsPending !== null) {
                            renderPage(pageNumIsPending);
                            pageNumIsPending = null;
                        }
                    });

                    document.getElementById('page-num').textContent = num;
                    document.getElementById('prev-page').disabled = num <= 1;
                    document.getElementById('next-page').disabled = num >= pdfDoc.numPages;
                    
                    document.getElementById('pdf-viewer-container').scrollTop = 0;
                    
                    // Enregistrer progression AJAX
                    saveProgress(num);
                });
            };

            const queueRenderPage = num => {
                if (pageIsRendering) {
                    pageNumIsPending = num;
                } else {
                    renderPage(num);
                }
            };

            const showPrevPage = () => {
                if (pageNum <= 1) return;
                pageNum--;
                queueRenderPage(pageNum);
            };

            const showNextPage = () => {
                if (pageNum >= pdfDoc.numPages) return;
                pageNum++;
                queueRenderPage(pageNum);
            };

            // Loading PDF
            pdfjsLib.getDocument(url).promise.then(pdfDoc_ => {
                pdfDoc = pdfDoc_;
                document.getElementById('page-count').textContent = pdfDoc.numPages;

                // Verifier la reprise
                if(targetPageReprise > 1 && targetPageReprise <= pdfDoc.numPages) {
                    document.getElementById('resume-page-num').textContent = targetPageReprise;
                    resumeModal.classList.remove('hidden');
                } else {
                    renderPage(pageNum);
                }
            }).catch(err => {
                console.error("Erreur PDF:", err);
            });

            // Boutons modale
            document.getElementById('btn-resume').addEventListener('click', () => {
                resumeModal.classList.add('hidden');
                pageNum = targetPageReprise;
                renderPage(pageNum);
            });
            document.getElementById('btn-restart').addEventListener('click', () => {
                resumeModal.classList.add('hidden');
                pageNum = 1;
                renderPage(pageNum);
            });

            // Events Pagination
            document.getElementById('prev-page').addEventListener('click', showPrevPage);
            document.getElementById('next-page').addEventListener('click', showNextPage);
            
            // Sauvegarde AJAX silencieuse
            function saveProgress(page) {
                fetch('/api/progression-pdf/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        categorie: "{{ categorie }}",
                        id: {{ document.id }},
                        page: page
                    })
                }).catch(e => console.log(e));
            }
        </script>

    {% else %}
        <div class="flex flex-col items-center justify-center h-full opacity-30 mt-20">
            <i class="fa-solid fa-file-circle-exclamation text-5xl mb-4 text-[#d4af37]"></i>
            <p>Documents introuvables.</p>
        </div>
    {% endif %}

</body>
</html>
